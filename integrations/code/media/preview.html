<!doctype html>
<html class="no-js">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="__CSP__">
    <base id="preview-base">
    <link rel="stylesheet" href="__STYLESHEET__">
    <link rel="stylesheet" href="__PALETTE__">
    <link rel="stylesheet" href="__KATEX_STYLESHEET__">
    <style>
      img {
        max-width: 100%;
        height: auto;
      }

      .preview-active-range {
        background-color: color-mix(in srgb, currentColor 10%, transparent);
        box-shadow:
          0 0 0 1px color-mix(in srgb, currentColor 28%, transparent),
          0 1px 3px color-mix(in srgb, currentColor 14%, transparent);
        border-radius: 3px;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }

      .md-typeset .preview-fragment-target {
        scroll-margin-top: 1.2rem
      }

      .md-typeset a.preview-external-link::after {
        content: "\2197";
        display: inline-block;
        font-size: 0.8em;
        margin-left: 0.2em;
        text-decoration: none;
        vertical-align: super;
      }

      .md-typeset {
        font-size: 0.9rem;
      }

      .md-typeset .mermaid {
        display: flex;
        justify-content: center;
        max-width: 100%;
        overflow-x: auto;
      }

      .md-typeset .mermaid svg {
        max-width: 100%;
        height: auto;
      }

      #preview-toolbar {
        align-items: center;
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
        background-color: color-mix(
          in srgb, var(--md-default-bg-color) 82%, transparent
        );
        font-size: 16px;
        display: none;
        gap: 0.45rem;
        padding: 0.55rem 0.8rem;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      #preview-toolbar strong {
        font-weight: 600;
      }

      #preview-variant-control {
        align-items: center;
        display: none;
        gap: 0.3rem;
      }

      #preview-variant {
        background: transparent;
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 3px;
        color: inherit;
        font: inherit;
        max-width: 14rem;
        padding: 0.15rem 1.4rem 0.15rem 0.35rem;
      }

    </style>
    <script nonce="__NONCE__" src="__KATEX__"></script>
    <script nonce="__NONCE__" src="__MERMAID__"></script>
  </head>
  <body
    dir="ltr"
    data-md-color-scheme="default"
    data-md-color-primary="indigo"
    data-md-color-accent="indigo"
  >
    <div id="preview-toolbar">
      <strong>Preview</strong>
      <label id="preview-variant-control" for="preview-variant">
        <span>Variant:</span>
        <select id="preview-variant"></select>
      </label>
    </div>
    <div class="md-content" data-md-component="content">
      <article id="preview" class="md-content__inner md-typeset"></article>
    </div>

    <script nonce="__NONCE__">
      let latestVersion = -1;
      let latestSession = null;
      const preview = document.getElementById("preview");
      const variantControl = document.getElementById("preview-variant-control");
      const variantSelect = document.getElementById("preview-variant");
      const vscode = acquireVsCodeApi();
      let lastAnchor = null;
      let activeSourceOffset = null;
      let activeLineStart = null;
      let activeLineEnd = null;
      let activeRange = null;
      let renderedUri = null;
      let fragmentTarget = null;
      let pendingFragment = null;
      let mermaidId = 0;
      const uiStateByUri = new Map();

      variantSelect.addEventListener("change", () => {
        vscode.postMessage({
          type: "preview/select-variant",
          variant: variantSelect.value,
        });
      });

      function updateVariants(message) {
        const variants = Array.isArray(message.variants) ? message.variants : [];
        const selected = message.selectedVariant;
        variantSelect.replaceChildren(
          ...variants.map((variant) => {
            const option = document.createElement("option");
            option.value = variant;
            option.textContent = variant;
            option.selected = variant === selected;
            return option;
          }),
        );
        const hasVariants = variants.length > 1;
        variantControl.style.display = hasVariants ? "flex" : "none";
        document.getElementById("preview-toolbar").style.display =
          hasVariants ? "flex" : "none";
      }

      function updateColorScheme() {
        document.body.dataset.mdColorScheme =
          document.body.classList.contains("vscode-dark") ||
          document.body.classList.contains("vscode-high-contrast")
            ? "slate"
            : "default";
        void renderMermaid();
      }

      updateColorScheme();
      new MutationObserver(updateColorScheme).observe(document.body, {
        attributes: true,
        attributeFilter: ["class"],
      });

      function sanitizeHtml(html) {
        const parsed = new DOMParser().parseFromString(html, "text/html");
        for (const node of parsed.querySelectorAll(
          "script,iframe,object,embed,base,form",
        )) {
          node.remove();
        }
        for (const node of parsed.querySelectorAll("*")) {
          for (const attr of [...node.attributes]) {
            const value = attr.value.trim().toLowerCase();
            if (
              attr.name.toLowerCase().startsWith("on") ||
              ((attr.name.toLowerCase() === "href" ||
                attr.name.toLowerCase() === "src") &&
                value.startsWith("javascript:"))
            ) {
              node.removeAttribute(attr.name);
            }
          }
        }
        for (const link of parsed.querySelectorAll("a[href]")) {
          const href = link.getAttribute("href")?.trim() ?? "";
          if (/^(?:https?:|mailto:|tel:|\/\/)/i.test(href)) {
            link.classList.add("preview-external-link");
          }
        }
        return parsed.body.childNodes;
      }

      preview.addEventListener("click", (event) => {
        const link = event.target.closest?.("a[href]");
        if (!link) return;

        const href = link.getAttribute("href");
        if (!href) {
          return;
        }

        if (href.startsWith("#")) {
          event.preventDefault();
          event.stopPropagation();
          const source = sourceForFragment(href.slice(1));
          if (source) {
            vscode.postMessage({ type: "preview/reveal-source", ...source });
          } else {
            revealFragment(href.slice(1));
          }
          return;
        }

        if (
          href.startsWith("//") ||
          /^[a-z][a-z0-9+.-]*:/i.test(href)
        ) {
          return;
        }

        event.preventDefault();
        event.stopPropagation();
        if (!renderedUri) return;
        vscode.postMessage({ type: "preview/open-link", href });
      });

      function revealFragment(fragment) {
        let id = fragment;
        try {
          id = decodeURIComponent(id);
        } catch {
          // Keep the raw fragment when it is not valid URI encoding.
        }
        const target = id ? document.getElementById(id) : document.body;
        fragmentTarget?.classList.remove("preview-fragment-target");
        fragmentTarget = target;
        fragmentTarget?.classList.add("preview-fragment-target");
        target?.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function sourceForFragment(fragment) {
        let id = fragment;
        try {
          id = decodeURIComponent(id);
        } catch {
          // Keep the raw fragment when it is not valid URI encoding.
        }
        const target = id ? document.getElementById(id) : null;
        const selector =
          "[data-md-source-uri][data-md-source-start][data-md-source-end]";
        const source = target?.matches(selector)
          ? target
          : target?.querySelector(selector);
        if (!source) return null;
        return {
          uri: source.dataset.mdSourceUri,
          end: Number(source.dataset.mdSourceEnd),
        };
      }

      function revealPendingFragment() {
        if (!pendingFragment || pendingFragment.uri !== renderedUri) return;
        const source = sourceForFragment(pendingFragment.fragment);
        if (source) {
          vscode.postMessage({ type: "preview/reveal-source", ...source });
        }
        pendingFragment = null;
      }

      function tabLabel(set, input) {
        return (
          [...set.querySelectorAll("label")]
            .find((label) => label.getAttribute("for") === input.id)
            ?.textContent.trim() ||
          input.value ||
          input.id
        );
      }

      function captureUiState(uri) {
        if (!uri) return;

        const tabs = [...preview.querySelectorAll(".tabbed-set")].map(
          (set) => {
            const input = set.querySelector('input[type="radio"]:checked');
            return input ? tabLabel(set, input) : null;
          },
        );
        const details = [...preview.querySelectorAll("details")].map(
          (detail) => detail.open,
        );
        uiStateByUri.set(uri, { tabs, details });
      }

      function restoreUiState(uri) {
        const state = uiStateByUri.get(uri);
        if (!state) return;

        [...preview.querySelectorAll(".tabbed-set")].forEach((set, index) => {
          const desired = state.tabs[index];
          if (!desired) return;

          const input = [...set.querySelectorAll('input[type="radio"]')].find(
            (candidate) => tabLabel(set, candidate) === desired,
          );
          if (input) {
            input.checked = true;
            input.dispatchEvent(new Event("change", { bubbles: true }));
          }
        });

        [...preview.querySelectorAll("details")].forEach((detail, index) => {
          if (state.details[index] !== undefined) {
            detail.open = state.details[index];
          }
        });
      }

      function typesetMath() {
        const mathNodes = [...preview.querySelectorAll(".arithmatex")];
        if (!window.katex) return;

        try {
          const delimiters = [
            { left: "$$", right: "$$", displayMode: true },
            { left: "$", right: "$", displayMode: false },
            { left: "\\[", right: "\\]", displayMode: true },
            { left: "\\(", right: "\\)", displayMode: false },
          ];
          for (const node of mathNodes) {
            const source = node.textContent.trim();
            const delimiter = delimiters.find(
              ({ left, right }) =>
                source.startsWith(left) && source.endsWith(right),
            );
            const expression = delimiter
              ? source.slice(
                  delimiter.left.length,
                  source.length - delimiter.right.length,
                )
              : source;
            if (!expression) continue;
            node.replaceChildren();
            window.katex.render(expression, node, {
              displayMode: delimiter?.displayMode ?? node.tagName === "DIV",
              throwOnError: false,
            });
          }
        } catch (error) {
          // Ignore invalid expressions so one math block cannot break preview updates.
        }
      }

      async function renderMermaid() {
        const nodes = [...preview.querySelectorAll(".mermaid")];
        if (!window.mermaid || !nodes.length) return;

        const dark =
          document.body.classList.contains("vscode-dark") ||
          document.body.classList.contains("vscode-high-contrast");
        window.mermaid.initialize({
          startOnLoad: false,
          securityLevel: "strict",
          theme: dark ? "dark" : "default",
        });

        for (const node of nodes) {
          const source = node.dataset.mermaidSource || node.textContent.trim();
          if (!source) continue;
          node.dataset.mermaidSource = source;

          try {
            const result = await window.mermaid.render(
              `preview-mermaid-${++mermaidId}`,
              source,
              node,
            );
            node.innerHTML = result.svg;
            result.bindFunctions?.(node);
          } catch {
            // Keep the source visible when Mermaid cannot parse a diagram.
          }
        }
      }

      function utf8Index(text) {
        const encoder = new TextEncoder();
        const bytes = [];
        const indices = [];
        let byteOffset = 0;
        let stringIndex = 0;

        for (const character of text) {
          bytes.push(byteOffset);
          indices.push(stringIndex);
          byteOffset += encoder.encode(character).length;
          stringIndex += character.length;
        }

        bytes.push(byteOffset);
        indices.push(text.length);
        return { bytes, indices };
      }

      function byteIndex(index, offset) {
        let low = 0;
        let high = index.bytes.length - 1;
        while (low < high) {
          const middle = Math.floor((low + high) / 2);
          if (index.bytes[middle] < offset) low = middle + 1;
          else high = middle;
        }
        return index.indices[low];
      }

      function decorateHtml(html, mappings) {
        const anchors = mappings
          .filter((mapping) =>
            ["text", "escapedText", "whitespace"].includes(mapping.kind),
          )
          .map((mapping) => {
            const spans =
              mapping.markdown.type === "direct"
                ? [mapping.markdown.spans]
                : mapping.markdown.spans;
            if (!spans.length) return null;

            return {
              uri: spans[0].uri,
              start: Math.min(...spans.map((span) => span.start)),
              end: Math.max(...spans.map((span) => span.end)),
              htmlStart: mapping.htmlStart,
              htmlEnd: mapping.htmlEnd,
            };
          })
          .filter((anchor) => anchor && anchor.htmlStart < anchor.htmlEnd)
          .sort((a, b) => a.htmlStart - b.htmlStart);

        const index = utf8Index(html);
        const parts = [];
        let cursor = 0;
        for (const anchor of anchors) {
          const start = byteIndex(index, anchor.htmlStart);
          const end = byteIndex(index, anchor.htmlEnd);
          if (start < cursor || end <= start) continue;

          parts.push(
            html.slice(cursor, start),
            '<span data-md-source-uri="',
            String(anchor.uri),
            '" data-md-source-start="',
            String(anchor.start),
            '" data-md-source-end="',
            String(anchor.end),
            '">',
            html.slice(start, end),
            "</span>",
          );
          cursor = end;
        }

        parts.push(html.slice(cursor));
        return parts.join("");
      }

      function findAnchor(sourceOffset, lineStart = null, lineEnd = null) {
        const anchors = [...preview.querySelectorAll("[data-md-source-start]")]
          .filter(
            (anchor) =>
              !anchor.dataset.mdSourceUri ||
              anchor.dataset.mdSourceUri === renderedUri,
          );
        const scoped =
          lineStart === null || lineEnd === null
            ? anchors
            : anchors.filter(
                (anchor) =>
                  Number(anchor.dataset.mdSourceStart) < lineEnd &&
                  Number(anchor.dataset.mdSourceEnd) > lineStart,
              );
        const matches = scoped.filter(
          (anchor) =>
            Number(anchor.dataset.mdSourceStart) <= sourceOffset &&
            sourceOffset < Number(anchor.dataset.mdSourceEnd),
        );
        if (matches.length) {
          return matches.sort(
            (a, b) =>
              Number(b.dataset.mdSourceStart) -
              Number(a.dataset.mdSourceStart),
          )[0];
        }

        const preceding = scoped.filter(
          (anchor) => Number(anchor.dataset.mdSourceEnd) <= sourceOffset,
        );
        if (preceding.length) return preceding[preceding.length - 1];
        return scoped.sort(
          (a, b) =>
            Math.abs(Number(a.dataset.mdSourceStart) - sourceOffset) -
            Math.abs(Number(b.dataset.mdSourceStart) - sourceOffset),
        )[0];
      }

      function blockFor(anchor) {
        return (
          anchor?.closest(
            "p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,table,figure,.admonition,.tabbed-set",
          ) || anchor
        );
      }

      function activateAncestors(anchor) {
        for (let node = anchor.parentElement; node; node = node.parentElement) {
          if (node.tagName === "DETAILS") node.open = true;
        }

        const sets = [];
        for (let node = anchor.parentElement; node; node = node.parentElement) {
          if (node.matches?.(".tabbed-set")) sets.push(node);
        }

        for (const set of sets) {
          const blocks = [...set.querySelectorAll(".tabbed-block")].filter(
            (block) => block.closest(".tabbed-set") === set,
          );
          const block = blocks.find((candidate) => candidate.contains(anchor));
          if (!block) continue;

          const index = blocks.indexOf(block);
          const inputs = [
            ...set.querySelectorAll('input[type="radio"]'),
          ].filter((input) => input.closest(".tabbed-set") === set);
          const input = inputs[index];
          if (input && !input.checked) {
            input.checked = true;
            input.dispatchEvent(new Event("change", { bubbles: true }));
          }
        }
      }

      function highlightActiveRange(sourceOffset, lineStart = null, lineEnd = null) {
        activeRange?.classList.remove("preview-active-range");
        activeRange = null;
        const anchor = findAnchor(sourceOffset, lineStart, lineEnd);
        if (!anchor) return;

        activateAncestors(anchor);
        anchor.classList.add("preview-active-range");
        activeRange = anchor;
      }

      function reveal(
        sourceOffset,
        lineStart = null,
        lineEnd = null,
        force = false,
      ) {
        const target = blockFor(findAnchor(sourceOffset, lineStart, lineEnd));
        if (!target || (!force && target === lastAnchor)) return;

        lastAnchor = target;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      window.addEventListener("message", (event) => {
        const message = event.data;
        if (message.type === "preview/variants") {
          updateVariants(message);
          return;
        }
        if (message.type === "preview/highlight") {
          activeSourceOffset = message.sourceOffset;
          activeLineStart = message.sourceLineStart;
          activeLineEnd = message.sourceLineEnd;
          highlightActiveRange(
            activeSourceOffset,
            activeLineStart,
            activeLineEnd,
          );
          return;
        }
        if (message.type === "preview/reveal") {
          reveal(
            message.sourceOffset,
            message.sourceLineStart,
            message.sourceLineEnd,
            message.force === true,
          );
          return;
        }
        if (message.type === "preview/reveal-fragment") {
          pendingFragment = {
            fragment: message.fragment,
            uri: message.uri,
          };
          revealPendingFragment();
          return;
        }
        if (message.type !== "preview/update") return;

        const update = message.update;
        if (update.session !== latestSession) {
          latestSession = update.session;
          latestVersion = -1;
          activeSourceOffset = null;
          activeLineStart = null;
          activeLineEnd = null;
        }
        if (update.version < latestVersion) return;

        document.getElementById("preview-base").href = update.baseUri;
        if (renderedUri) captureUiState(renderedUri);
        latestVersion = update.version;
        lastAnchor = null;
        activeRange = null;
        renderedUri = update.uri;
        preview.replaceChildren(
          ...sanitizeHtml(decorateHtml(update.html, update.mappings || [])),
        );
        typesetMath();
        void renderMermaid();
        restoreUiState(renderedUri);
        revealPendingFragment();
        if (activeSourceOffset !== null) {
          highlightActiveRange(
            activeSourceOffset,
            activeLineStart,
            activeLineEnd,
          );
        }
      });
    </script>
  </body>
</html>
