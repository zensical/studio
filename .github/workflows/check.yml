name: Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: >-
    ${{ github.workflow }}-${{
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.number || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        github.event.action != 'closed' }}

jobs:
  zizmor:
    name: Zizmor
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          collect: all
          advanced-security: false

  release:
    name: Release
    if: always() && startsWith(github.head_ref, 'release/')
    needs: zizmor
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          jq -e 'length > 0 and all(.[]; .result == "success")'
          <<< "$RESULTS"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Check commit count
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          commits=$(git rev-list --count "$HEAD" "^$BASE")
          if [ "$commits" -ne 1 ]; then
            echo "Release branch must contain exactly one commit," \
              "found $commits"
            exit 1
          fi
