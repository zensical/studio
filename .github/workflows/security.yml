name: Security

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions: {}
defaults:
  run:
    shell: bash

concurrency:
  group: >-
    ${{ github.workflow }}-${{
        github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.number || github.run_id }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request' &&
        github.event.action != 'closed' }}

jobs:
  audit:
    name: Audit
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Audit grammar dependencies
        working-directory: grammars/textmate/python-markdown
        run: npm audit --package-lock-only --ignore-scripts --audit-level=low

      - name: Check Picomatch remains build-only
        working-directory: integrations/code
        run: |
          jq -e 'all(
            .packages | to_entries[] |
              select(.key | endswith("node_modules/picomatch"));
            .value.dev == true
          )' package-lock.json

      - name: Audit extension dependencies
        working-directory: integrations/code
        run: >-
          npx --yes --ignore-scripts audit-ci@7.1.0
          --config ../../.github/audit-ci.jsonc
